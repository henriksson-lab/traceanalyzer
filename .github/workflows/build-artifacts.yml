name: Build artifacts

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and package checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux GUI test dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Headless GUI render test
        run: cargo test -p traceanalyzer --test headless_render

      - name: Package traceio
        run: cargo package -p traceio --allow-dirty

  windows-exe:
    name: Windows executable
    needs: checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build -p traceanalyzer --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/traceanalyzer.exe "dist/Trace analyzer.exe"
          Compress-Archive -Path "dist/Trace analyzer.exe" -DestinationPath trace-analyzer-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trace-analyzer-windows-x64
          path: trace-analyzer-windows-x64.zip
          retention-days: 14

  linux-deb:
    name: Debian package
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build .deb
        run: make deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trace-analyzer-linux-amd64-deb
          path: target/deb/*.deb
          retention-days: 14

  macos-app:
    name: macOS app bundle (universal)
    needs: checks
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build app bundle
        run: make osx-app-universal

      - name: Verify universal binary
        run: lipo "target/osx/Trace analyzer.app/Contents/MacOS/traceanalyzer" -verify_arch x86_64 arm64

      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent "target/osx/Trace analyzer.app" trace-analyzer-macos-universal.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trace-analyzer-macos-universal
          path: trace-analyzer-macos-universal.zip
          retention-days: 14

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-exe, linux-deb, macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: trace-analyzer-*
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.deb
